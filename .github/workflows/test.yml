name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      -
        name: Stage module files
        shell: bash
        run: |
          cp vendor.mod go.mod
          cp vendor.sum go.sum
      -
        name: Test
        shell: bash
        run: |
          set -eu
          SKIP='TestImpliedDirectoryPermissions'
          if [ "$RUNNER_OS" = "macOS" ]; then
            SKIP='TestImpliedDirectoryPermissions|TestChangesWithChangesGH13590|TestApplyLayer'
          fi
          go test -mod=vendor -count=1 -short -timeout 25m -skip "$SKIP" \
            ./client/... \
            ./errdefs/... \
            ./opts/... \
            ./pkg/archive/... \
            ./pkg/homedir/... \
            ./pkg/idtools/... \
            ./pkg/jsonmessage/... \
            ./pkg/namesgenerator/... \
            ./pkg/stdcopy/... \
            ./pkg/stringid/... \
            ./pkg/tailfile/... \
            ./api/types/...
      -
        name: Test authorization
        shell: bash
        run: |
          set -eu
          go test -mod=vendor -count=1 -v -timeout 10m ./pkg/authorization/...
      -
        name: Test plugin
        shell: bash
        run: |
          set -eu
          # The plugin package only has an implementation for linux and windows
          # (pm.enable/pm.restore/recursiveUnmount are unimplemented on darwin),
          # so it does not compile on macOS.
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "skipping: the plugin package has no darwin implementation"
            exit 0
          fi
          go test -mod=vendor -count=1 -v -timeout 10m -run 'TestValidatePrivileges' ./plugin/
      -
        name: Test daemon containerfs
        shell: bash
        run: |
          set -eu
          # daemon/containerfs_linux.go and its test are linux-only (implied by
          # the _linux filename suffix), and the daemon package has no darwin
          # implementation at all, so this only runs on Linux.
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "skipping: daemon/containerfs_linux_test.go is linux-only (the daemon package has no darwin implementation)"
            exit 0
          fi
          go test -mod=vendor -count=1 -v -timeout 10m -run 'TestCreateIfNotExists' ./daemon/
      -
        name: Vet daemon and integration packages
        shell: bash
        run: |
          set -eu
          # The daemon and integration/container packages cannot be executed in
          # full here: most of the daemon suite and all of integration/container
          # need a live dockerd. Type-check them instead — go vet compiles both
          # the non-test sources and the *_test.go files without running them.
          # (The self-contained daemon unit tests that do run without a dockerd
          # are executed by the step above.)
          case "$RUNNER_OS" in
            Linux)
              go vet -mod=vendor ./daemon/ ./integration/container/
              ;;
            Windows)
              # daemon/archive_unix.go is !windows, so only the integration
              # test package is meaningful to type-check here.
              go vet -mod=vendor ./integration/container/
              ;;
            *)
              echo "skipping: the daemon package has no darwin implementation"
              ;;
          esac

  module-zip:
    name: module-zip
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      -
        name: Restore pristine .github from the upstream tag
        run: |
          set -eu
          curl -sSfL https://github.com/moby/moby/archive/refs/tags/v28.0.1.tar.gz -o /tmp/upstream.tar.gz
          mkdir -p /tmp/upstream
          tar -xzf /tmp/upstream.tar.gz -C /tmp/upstream
          rm -rf .github
          cp -r /tmp/upstream/moby-28.0.1/.github .github
      -
        name: Drop non-module files
        run: |
          set -eu
          rm -rf .git
          rm -f go.mod go.sum
      -
        name: Build module zip
        run: |
          set -eu
          mkdir -p /tmp/helper
          cat > /tmp/helper/create_mod.go <<'GOEOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              out, err := os.Create(os.Args[2])
              if err != nil {
                  log.Fatal(err)
              }
              defer out.Close()
              mv := module.Version{Path: "github.com/docker/docker", Version: "v28.0.1+incompatible"}
              if err := zip.CreateFromDir(out, mv, os.Args[1]); err != nil {
                  log.Fatal(err)
              }
          }
          GOEOF
          cd /tmp/helper
          go mod init helper
          go get golang.org/x/mod@v0.24.0
          go run . "$GITHUB_WORKSPACE" /tmp/module.zip
      -
        name: Append vendor/modules.txt
        run: |
          set -eu
          PREFIX='github.com/docker/docker@v28.0.1+incompatible'
          mkdir -p "/tmp/stage/$PREFIX/vendor"
          cp "$GITHUB_WORKSPACE/vendor/modules.txt" "/tmp/stage/$PREFIX/vendor/modules.txt"
          cd /tmp/stage
          zip -g -X /tmp/module.zip "$PREFIX/vendor/modules.txt"
          mkdir -p /tmp/out
          cp /tmp/module.zip "/tmp/out/v28.0.1+incompatible.zip"
          unzip -l /tmp/out/v28.0.1+incompatible.zip | tail -5
      -
        name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: /tmp/out/v28.0.1+incompatible.zip
          if-no-files-found: error
